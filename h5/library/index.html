<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>我的案例库 · 辙见</title>
  <meta name="description" content="登录后查看已托管的维修档案。与小程序同一账号。" />
  <meta name="robots" content="noindex,nofollow" />
  <link rel="stylesheet" href="/shared/tokens.css" />
  <link rel="stylesheet" href="/shared/base-page.css" />
  <link rel="stylesheet" href="/shared/gh-chrome.css?v=20260912b" />
</head>
<body>
  <div id="blankBox" class="gh-blankslate" hidden>
    <h1>我的案例库</h1>
    <p>登录后查看你托管的维修档案</p>
    <button type="button" class="gh-btn gh-btn--primary" id="btnOpenLogin">登录</button>
  </div>
  <div id="profileBox" class="gh-profile" hidden>
    <aside>
      <div id="avatarBox"></div>
      <h1 class="gh-profile-name" id="nameBox"></h1>
      <p class="gh-profile-meta" id="metaBox"></p>
      <p style="margin-top:16px">
        <button type="button" class="gh-btn" id="btnLogout">退出</button>
      </p>
    </aside>
    <main>
      <nav class="gh-tabs" aria-label="案例库">
        <span class="gh-tab is-on">托管档案</span>
      </nav>
      <div id="listBox"></div>
    </main>
  </div>
  <script src="/shared/h5-auth.js?v=20260912b"></script>
  <script src="/shared/h5-auth-modal.js?v=20260912b"></script>
  <script src="/shared/site-chrome.js?v=20260912b"></script>
  <script>
    (function () {
      var API = (window.ZHEJIAN_API_BASE || '') + '/api/v1/merchant/hosted-cases'
      var blankBox = document.getElementById('blankBox')
      var profileBox = document.getElementById('profileBox')
      var listBox = document.getElementById('listBox')

      function escapeHtml(str) {
        return String(str || '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
      }

      function showGuest() {
        blankBox.hidden = false
        profileBox.hidden = true
      }

      function avatarHtml(session) {
        var name = window.zhejianH5Auth.displayName(session)
        var url = window.zhejianH5Auth.avatarUrl(session)
        if (url) {
          return '<img class="gh-avatar-lg" src="' + escapeHtml(url) + '" alt="" width="96" height="96" />'
        }
          return (
          '<span class="gh-avatar-lg is-letter">' +
          escapeHtml(String(name).slice(0, 1)) +
          '</span>'
        )
      }

      function renderList(list) {
        if (!list.length) {
          listBox.innerHTML = '<p class="gh-empty">还没有托管档案</p>'
          return
        }
        listBox.innerHTML = list
          .map(function (item) {
            var href = item.publicPath || ''
            var title = escapeHtml(item.title || item.serviceName || '案例档案')
            var vis = item.visibility === 'public' ? '公开' : '私密'
            var date = item.updatedAt ? String(item.updatedAt).slice(0, 10) : ''
            var heading = href
              ? '<a href="' + escapeHtml(href) + '">' + title + '</a>'
              : title
            return (
              '<article class="gh-repo"><h2>' +
              heading +
              ' <span class="gh-label">' +
              vis +
              '</span></h2><p class="gh-repo-meta">' +
              (date ? '更新于 ' + escapeHtml(date) : '') +
              '</p></article>'
            )
          })
          .join('')
      }

      function loadLibrary(session) {
        blankBox.hidden = true
        profileBox.hidden = false
        document.getElementById('avatarBox').innerHTML = avatarHtml(session)
        document.getElementById('nameBox').textContent = window.zhejianH5Auth.displayName(session)
        var merchant = window.zhejianH5Auth.isMerchant(session)
        document.getElementById('metaBox').textContent = merchant ? '门店' : '个人'
        if (!merchant) {
          listBox.innerHTML = '<p class="gh-empty">个人账号可星标档案。托管店页档案请用已入驻门店的账号。</p>'
          return
        }
        listBox.innerHTML = '<p class="gh-empty">加载中…</p>'
        fetch(API, {
          headers: Object.assign({ Accept: 'application/json' }, window.zhejianH5Auth.authHeader()),
        })
          .then(function (r) {
            return r.json().then(function (j) {
              if (!r.ok) throw new Error((j && j.message) || '加载失败')
              return j
            })
          })
          .then(function (j) {
            var data = j.data || j
            renderList((data && data.list) || [])
          })
          .catch(function (e) {
            listBox.innerHTML = '<p class="gh-err">' + escapeHtml(e.message || '加载失败') + '</p>'
          })
      }

      function refresh() {
        var session = window.zhejianH5Auth.readSession()
        if (session) loadLibrary(session)
        else showGuest()
      }

      document.getElementById('btnOpenLogin').addEventListener('click', function () {
        window.zhejianH5AuthModal.open({ onSuccess: loadLibrary })
      })
      document.getElementById('btnLogout').addEventListener('click', function () {
        window.zhejianH5Auth.clearSession()
        showGuest()
      })
      window.addEventListener('zhejian-auth-change', refresh)
      refresh()
    })()
  </script>
</body>
</html>
