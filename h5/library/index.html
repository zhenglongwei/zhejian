<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>我的 · 辙见</title>
  <meta name="description" content="登录后管理显示名、托管档案与星标。" />
  <meta name="robots" content="noindex,nofollow" />
  <link rel="stylesheet" href="/shared/tokens.css" />
  <link rel="stylesheet" href="/shared/base-page.css" />
  <link rel="stylesheet" href="/shared/gh-chrome.css?v=20260912e" />
</head>
<body>
  <div id="blankBox" class="gh-blankslate" hidden>
    <h1>我的</h1>
    <p>登录后查看资料、托管档案和星标</p>
    <button type="button" class="gh-btn gh-btn--primary" id="btnOpenLogin">登录</button>
  </div>
  <div id="profileBox" class="gh-profile" hidden>
    <aside>
      <div id="avatarBox"></div>
      <h1 class="gh-profile-name" id="nameBox"></h1>
      <p class="gh-profile-meta" id="metaBox"></p>
      <p class="gh-profile-meta" id="publicLinkBox"></p>
    </aside>
    <main>
      <nav class="gh-tabs" aria-label="我的">
        <button type="button" class="gh-tab is-on" id="tabProfile" data-tab="profile">资料</button>
        <button type="button" class="gh-tab" id="tabHosted" data-tab="hosted">托管档案</button>
        <button type="button" class="gh-tab" id="tabStarred" data-tab="starred">星标</button>
      </nav>
      <div id="listBox"></div>
    </main>
  </div>
  <script src="/shared/h5-auth.js?v=20260912e"></script>
  <script src="/shared/h5-auth-modal.js?v=20260912e"></script>
  <script src="/shared/site-chrome.js?v=20260912e"></script>
  <script>
    (function () {
      var API_HOSTED = (window.ZHEJIAN_API_BASE || '') + '/api/v1/merchant/hosted-cases'
      var API_STARS = (window.ZHEJIAN_API_BASE || '') + '/api/v1/user/favorites?type=case'
      var API_PROFILE = (window.ZHEJIAN_API_BASE || '') + '/api/v1/user/profile'
      var API_STORES = (window.ZHEJIAN_API_BASE || '') + '/api/v1/merchant/stores'
      var blankBox = document.getElementById('blankBox')
      var profileBox = document.getElementById('profileBox')
      var listBox = document.getElementById('listBox')
      var currentTab = 'profile'
      var lastSession = null
      var storeCache = null

      function escapeHtml(str) {
        return String(str || '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
      }

      function showGuest() {
        blankBox.hidden = false
        profileBox.hidden = true
      }

      function avatarHtml(session) {
        var name = window.zhejianH5Auth.displayName(session)
        var url = window.zhejianH5Auth.avatarUrl(session)
        if (url) {
          return '<img class="gh-avatar-lg" src="' + escapeHtml(url) + '" alt="" width="96" height="96" />'
        }
        return (
          '<span class="gh-avatar-lg is-letter">' +
          escapeHtml(String(name).slice(0, 1)) +
          '</span>'
        )
      }

      function setTab(tab) {
        currentTab = tab
        document.getElementById('tabProfile').classList.toggle('is-on', tab === 'profile')
        document.getElementById('tabHosted').classList.toggle('is-on', tab === 'hosted')
        document.getElementById('tabStarred').classList.toggle('is-on', tab === 'starred')
      }

      function repoCard(item) {
        var href = item.publicPath || item.href || ''
        if (!href && item.id) href = '/case/view.html?id=' + encodeURIComponent(item.id)
        var title = escapeHtml(item.title || item.serviceName || '案例档案')
        var vis = item.visibility === 'public' ? '公开' : item.visibility === 'private' ? '私密' : ''
        var date = item.updatedAt || item.publishedAt || item.createdAt || ''
        if (date) date = String(date).slice(0, 10)
        var heading = href
          ? '<a href="' + escapeHtml(href) + '">' + title + '</a>'
          : title
        var cover = item.coverImage || item.coverImageDesensitized || ''
        var thumb = cover
          ? '<img class="gh-repo-thumb" src="' + escapeHtml(cover) + '" alt="" />'
          : '<span class="gh-repo-thumb"></span>'
        return (
          '<article class="gh-repo">' +
          thumb +
          '<div><h2>' +
          heading +
          (vis ? ' <span class="gh-label">' + vis + '</span>' : '') +
          '</h2><p class="gh-repo-meta">' +
          (date ? '更新于 ' + escapeHtml(date) : '') +
          '</p></div></article>'
        )
      }

      function renderList(list, emptyText) {
        if (!list.length) {
          listBox.innerHTML = '<p class="gh-empty">' + escapeHtml(emptyText) + '</p>'
          return
        }
        listBox.innerHTML = list.map(repoCard).join('')
      }

      function fetchJson(url, options) {
        options = options || {}
        var headers = Object.assign(
          { Accept: 'application/json' },
          window.zhejianH5Auth.authHeader(),
          options.headers || {}
        )
        return fetch(url, {
          method: options.method || 'GET',
          headers: headers,
          body: options.body || undefined,
        }).then(function (r) {
          return r.json().then(function (j) {
            if (!r.ok) throw new Error((j && j.message) || '加载失败')
            return j.data != null ? j.data : j
          })
        })
      }

      function renderProfileForm(session) {
        var user = (session && session.user) || {}
        var merchant = window.zhejianH5Auth.isMerchant(session)
        var storeId = session && session.merchant && session.merchant.storeId
        var storeLine = ''
        if (storeCache && storeCache.name) {
          storeLine =
            '<p class="gh-profile-store">' +
            escapeHtml(storeCache.name) +
            (storeCache.address ? '<br />' + escapeHtml(storeCache.address) : '') +
            '</p>'
        }
        listBox.innerHTML =
          '<form class="gh-profile-form" id="profileForm">' +
          '<label class="gh-profile-label" for="nicknameInput">显示名</label>' +
          '<input class="gh-field" id="nicknameInput" name="nickname" maxlength="32" value="' +
          escapeHtml(user.nickname || '') +
          '" />' +
          '<button type="submit" class="gh-btn gh-btn--primary" id="profileSave">保存</button>' +
          '<p class="gh-empty" id="profileMsg"></p>' +
          (merchant
            ? '<div class="gh-profile-store-block"><h2>门店</h2>' +
              storeLine +
              (storeId
                ? '<p><a class="h5-link" href="/store/' +
                  encodeURIComponent(storeId) +
                  '.html">查看公开页</a></p>'
                : '') +
              '</div>'
            : '') +
          '</form>'
        var form = document.getElementById('profileForm')
        form.addEventListener('submit', function (e) {
          e.preventDefault()
          var nickname = document.getElementById('nicknameInput').value.trim()
          var msg = document.getElementById('profileMsg')
          var btn = document.getElementById('profileSave')
          btn.disabled = true
          fetchJson(API_PROFILE, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ nickname: nickname }),
          })
            .then(function (updated) {
              var next = Object.assign({}, session, {
                user: Object.assign({}, session.user || {}, updated || { nickname: nickname }),
              })
              window.zhejianH5Auth.saveSession(next)
              msg.textContent = '已保存'
              btn.disabled = false
            })
            .catch(function (err) {
              msg.textContent = err.message || '保存失败'
              btn.disabled = false
            })
        })
      }

      function loadHosted(session) {
        if (!window.zhejianH5Auth.isMerchant(session)) {
          renderList([], '个人账号可星标档案。托管店页档案请用已入驻门店的账号。')
          return
        }
        listBox.innerHTML = '<p class="gh-empty">加载中…</p>'
        fetchJson(API_HOSTED)
          .then(function (data) {
            renderList((data && data.list) || [], '还没有托管档案')
          })
          .catch(function (e) {
            listBox.innerHTML = '<p class="gh-err">' + escapeHtml(e.message || '加载失败') + '</p>'
          })
      }

      function loadStarred() {
        listBox.innerHTML = '<p class="gh-empty">加载中…</p>'
        fetchJson(API_STARS)
          .then(function (data) {
            var rows = (data && data.list) || []
            var list = rows
              .filter(function (row) {
                return row && row.available !== false && row.item
              })
              .map(function (row) {
                var item = row.item || {}
                return {
                  id: item.id || row.targetId,
                  title: item.title || item.serviceName,
                  coverImage: item.coverImageDesensitized || item.coverImage,
                  publishedAt: item.publishedAt,
                  href: item.slug
                    ? '/case/' + encodeURIComponent(item.slug) + '.html'
                    : item.id
                      ? '/case/view.html?id=' + encodeURIComponent(item.id)
                      : '',
                  visibility: 'public',
                }
              })
            renderList(list, '还没有星标档案')
          })
          .catch(function (e) {
            listBox.innerHTML = '<p class="gh-err">' + escapeHtml(e.message || '加载失败') + '</p>'
          })
      }

      function showTab(tab, session) {
        setTab(tab)
        if (tab === 'starred') loadStarred()
        else if (tab === 'hosted') loadHosted(session)
        else renderProfileForm(session)
      }

      function fillHeader(session) {
        document.getElementById('avatarBox').innerHTML = avatarHtml(session)
        document.getElementById('nameBox').textContent = window.zhejianH5Auth.displayName(session)
        var merchant = window.zhejianH5Auth.isMerchant(session)
        document.getElementById('metaBox').textContent = merchant ? '门店账号' : '个人账号'
        var storeId = session && session.merchant && session.merchant.storeId
        var publicLinkBox = document.getElementById('publicLinkBox')
        if (merchant && storeId) {
          publicLinkBox.innerHTML =
            '<a href="/store/' + encodeURIComponent(storeId) + '.html">公开页</a>'
        } else {
          publicLinkBox.textContent = ''
        }
      }

      function loadLibrary(session) {
        lastSession = session
        blankBox.hidden = true
        profileBox.hidden = false
        fillHeader(session)
        if (window.zhejianH5Auth.isMerchant(session) && !storeCache) {
          fetchJson(API_STORES)
            .then(function (data) {
              var list = (data && data.list) || []
              storeCache = list[0] || null
              if (currentTab === 'profile') renderProfileForm(session)
              fillHeader(session)
            })
            .catch(function () {})
        }
        showTab(currentTab, session)
      }

      function refresh() {
        var session = window.zhejianH5Auth.readSession()
        if (session) loadLibrary(session)
        else showGuest()
      }

      document.getElementById('tabProfile').addEventListener('click', function () {
        if (lastSession) showTab('profile', lastSession)
      })
      document.getElementById('tabHosted').addEventListener('click', function () {
        if (lastSession) showTab('hosted', lastSession)
      })
      document.getElementById('tabStarred').addEventListener('click', function () {
        if (lastSession) showTab('starred', lastSession)
      })
      document.getElementById('btnOpenLogin').addEventListener('click', function () {
        window.zhejianH5AuthModal.open({ onSuccess: loadLibrary })
      })
      window.addEventListener('zhejian-auth-change', refresh)
      refresh()
    })()
  </script>
</body>
</html>
