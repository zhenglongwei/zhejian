<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>辙见 · 拜访宣传单 A4</title>
  <style>
    :root {
      --primary: #1677ff;
      --primary-light: #e8f3ff;
      --text: #1f2329;
      --secondary: #646a73;
      --border: #e5e6eb;
      --muted: #8f959e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    @page { size: A4; margin: 12mm; }
    body {
      font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
      color: var(--text);
      background: #f0f2f5;
    }
    .page {
      width: 210mm;
      min-height: 297mm;
      margin: 16px auto;
      padding: 14mm 16mm;
      background: #fff;
      display: flex;
      flex-direction: column;
      gap: 9mm;
      box-shadow: 0 8px 24px rgba(0,0,0,.08);
    }
    .brand {
      display: flex;
      align-items: baseline;
      gap: 8px;
    }
    .brand strong {
      font-size: 22px;
      color: var(--primary);
      letter-spacing: 0.04em;
    }
    .brand span {
      font-size: 11px;
      color: var(--muted);
    }
    h1 {
      font-size: 28px;
      line-height: 1.35;
      font-weight: 700;
      text-align: center;
      letter-spacing: 0.02em;
    }
    h1 em {
      font-style: normal;
      color: var(--primary);
    }
    .fact {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      background: var(--primary-light);
      border-radius: 10px;
    }
    .fact .yen {
      flex: 0 0 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--primary);
      color: #fff;
      display: grid;
      place-items: center;
      font-weight: 700;
      font-size: 16px;
    }
    .fact p {
      flex: 1;
      font-size: 13px;
      line-height: 1.45;
    }
    .badges {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .badge {
      font-size: 11px;
      color: var(--primary);
      border: 1px solid var(--primary);
      border-radius: 999px;
      padding: 3px 10px;
      white-space: nowrap;
      background: #fff;
      text-align: center;
    }
    .principle {
      text-align: center;
    }
    .flow {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    .node {
      width: 92px;
      text-align: center;
    }
    .node .circle {
      width: 64px;
      height: 64px;
      margin: 0 auto 8px;
      border-radius: 50%;
      border: 2px solid var(--border);
      display: grid;
      place-items: center;
      font-size: 13px;
      font-weight: 600;
      position: relative;
      background: #fff;
    }
    .node.kill .circle {
      color: var(--muted);
      text-decoration: line-through;
    }
    .node.kill .circle::after {
      content: "";
      position: absolute;
      width: 70%;
      height: 2px;
      background: #c9cdd4;
      transform: rotate(-28deg);
    }
    .node.ok .circle {
      border-color: var(--primary);
      color: var(--primary);
      background: var(--primary-light);
    }
    .node.solid .circle {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
      font-size: 11px;
      padding: 6px;
      line-height: 1.25;
    }
    .arrow { color: var(--primary); font-size: 22px; }
    .principle .hint {
      margin-top: 8px;
      font-size: 12px;
      color: var(--secondary);
    }
    .main {
      display: grid;
      grid-template-columns: 1.05fr 1fr;
      gap: 12px;
      flex: 1;
      align-items: stretch;
    }
    .compare, .tool {
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 12px;
    }
    .compare {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      text-align: center;
    }
    .vs-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .ghost {
      width: 64px;
      opacity: 0.45;
      font-size: 12px;
      color: var(--muted);
    }
    .ghost .box {
      height: 52px;
      border: 1px dashed #c9cdd4;
      border-radius: 8px;
      display: grid;
      place-items: center;
      margin-bottom: 4px;
      position: relative;
    }
    .ghost .box::after {
      content: "×";
      position: absolute;
      font-size: 28px;
      color: #c9cdd4;
    }
    .asset {
      background: var(--primary);
      color: #fff;
      border-radius: 10px;
      padding: 14px 16px;
      font-size: 18px;
      font-weight: 700;
      min-width: 110px;
    }
    .compare .line {
      font-size: 12px;
      color: var(--secondary);
      line-height: 1.5;
      max-width: 240px;
    }
    .tool h2 {
      font-size: 15px;
      text-align: center;
      margin-bottom: 12px;
      color: var(--primary);
    }
    .qrs {
      display: flex;
      justify-content: center;
      gap: 18px;
    }
    .qr {
      text-align: center;
      width: 110px;
    }
    .qr img {
      width: 96px;
      height: 96px;
      object-fit: contain;
      border: 1px dashed var(--border);
      border-radius: 8px;
      padding: 4px;
      background: #fff;
    }
    .qr figcaption {
      margin-top: 6px;
      font-size: 12px;
      color: var(--secondary);
    }
    .timeline {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
      padding: 10px 4px 0;
    }
    .step {
      flex: 1;
      text-align: center;
      font-size: 13px;
      font-weight: 600;
    }
    .step i {
      display: inline-grid;
      place-items: center;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: var(--primary);
      color: #fff;
      font-style: normal;
      font-size: 12px;
      margin-right: 4px;
    }
    .timeline .sep {
      color: var(--primary);
      font-size: 16px;
    }
    .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 1px solid var(--border);
      padding-top: 10px;
      gap: 16px;
    }
    .sales {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .sales img {
      width: 72px;
      height: 72px;
      object-fit: cover;
      border-radius: 8px;
      border: 1px solid var(--border);
    }
    .sales .label {
      font-size: 13px;
      color: var(--secondary);
      line-height: 1.5;
    }
    .sales .label strong {
      display: block;
      color: var(--text);
      font-size: 14px;
      margin-bottom: 2px;
    }
    .footer .brand-end {
      text-align: right;
      font-size: 11px;
      color: var(--muted);
      line-height: 1.5;
    }
    .footer .brand-end b {
      color: var(--primary);
      font-size: 16px;
      display: block;
    }
    .print-hint {
      max-width: 210mm;
      margin: 0 auto 24px;
      padding: 0 8px;
      font-size: 13px;
      color: var(--secondary);
      text-align: center;
    }
    @media print {
      body { background: #fff; }
      .page {
        margin: 0;
        box-shadow: none;
        width: auto;
        min-height: auto;
        height: 100vh;
      }
      .print-hint { display: none; }
    }
  </style>
</head>
<body>
  <p class="print-hint">浏览器打开本页 → 打印 → 纸张 A4、背景图形开启。三枚码均为真实可扫码图。</p>
  <article class="page">
    <header class="brand">
      <strong>辙见</strong>
      <span>杭州盈简科技有限公司</span>
    </header>

    <h1>客户已经开始用<em>AI</em>找服务了</h1>

    <section class="fact">
      <div class="yen">¥</div>
      <p>豆包问答成交已收渠道服务费（如酒店约 12%，部分生活服务更高）</p>
      <div class="badges">
        <span class="badge">排序不靠广告费</span>
        <span class="badge">信号，不是唯一战场</span>
      </div>
    </section>

    <section class="principle">
      <div class="flow">
        <div class="node kill"><div class="circle">关键词</div></div>
        <span class="arrow">→</span>
        <div class="node ok"><div class="circle">语义</div></div>
        <span class="arrow">→</span>
        <div class="node solid"><div class="circle">可核对的<br />真材料</div></div>
      </div>
      <p class="hint">AI 按意思找内容，不是数关键词</p>
    </section>

    <section class="main">
      <div class="compare">
        <div class="vs-row">
          <div class="ghost"><div class="box"></div>发文</div>
          <div class="ghost"><div class="box"></div>短视频</div>
          <span style="color:var(--muted);font-size:12px;">VS</span>
          <div class="asset">案例资产</div>
        </div>
        <p class="line">技术一变，形式就贬值；真案例才扛得住迭代</p>
      </div>
      <div class="tool">
        <h2>辙见案例工具</h2>
        <div class="qrs">
          <figure class="qr">
            <img src="qr-official-account.png" alt="公众号二维码" />
            <figcaption>公众号</figcaption>
          </figure>
          <figure class="qr">
            <img src="qr-miniprogram.png" alt="小程序码" />
            <figcaption>小程序</figcaption>
          </figure>
        </div>
      </div>
    </section>

    <section class="timeline">
      <div class="step"><i>1</i>起步免费</div>
      <span class="sep">→</span>
      <div class="step"><i>2</i>透明化过程</div>
      <span class="sep">→</span>
      <div class="step"><i>3</i>按效果付费</div>
    </section>

    <footer class="footer">
      <div class="sales">
        <img src="qr-sales-wechat.png" alt="销售微信二维码" />
        <div class="label">
          <strong>销售微信</strong>
          扫码添加，了解合作
        </div>
      </div>
      <div class="brand-end">
        <b>辙见</b>
        杭州盈简科技有限公司
      </div>
    </footer>
  </article>
</body>
</html>
